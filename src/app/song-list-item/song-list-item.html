<div class="song-card" (click)="selectSong()">

  <img [src]="song.imageUrl" alt="Song image" class="song-image" />

  <h3>{{ song.title }}</h3>

  <p><strong>Artist:</strong> {{ song.artist }}</p>
  <p><strong>Genre:</strong> {{ song.genre }}</p>
  <p><strong>Duration:</strong> {{ song.durationSeconds }} seconds</p>

  <div *ngIf="song.album">
    <p><strong>Album:</strong> {{ song.album }}</p>
  </div>

  <button type="button" (click)="selectSong(); $event.stopPropagation()">
    Select
  </button>

</div>
