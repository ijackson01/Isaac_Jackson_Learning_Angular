<form [formGroup]="form" (ngSubmit)="onSubmit()">

  <div class="form-group">
    <label for="id">ID</label>
    <input type="number" id="id" formControlName="id" />
  </div>

  <div class="form-group">
    <label for="title">Title</label>
    <input type="text" id="title" formControlName="title" />
  </div>

  <div class="form-group">
    <label for="artist">Artist</label>
    <input type="text" id="artist" formControlName="artist" />
  </div>

  <div class="form-group">
    <label for="genre">Genre</label>
    <input type="text" id="genre" formControlName="genre" />
  </div>

  <div class="form-group">
    <label for="durationSeconds">Duration</label>
    <input type="number" id="durationSeconds" formControlName="durationSeconds" />
  </div>

  <div class="form-group">
    <label for="album">Album</label>
    <input type="text" id="album" formControlName="album" />
  </div>

  <div class="form-group">
    <label for="imageUrl">Image URL</label>
    <input type="text" id="imageUrl" formControlName="imageUrl" />
  </div>

  <button type="submit">{{ editing ? 'Update' : 'Add Song' }}</button>
  <button *ngIf="editing" type="button" (click)="onDelete()">Delete</button>
  <button type="button" (click)="navigateToSongList()">Back to List</button>

</form>

<div *ngIf="error" class="error">{{ error }}</div>
